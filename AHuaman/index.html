<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Digital de Contacto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      text-align: center;
    }
    
    /* Logo de la empresa (Aumentado de tamaño) */
    .header {
      background-color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }
    .company-logo {
      max-height: 90px;
      max-width: 90%;
      object-fit: contain;
    }

    /* Perfil del usuario */
    .profile-section {
      padding: 25px 20px;
    }
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #0066cc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #1a1a1a; }
    p.title { color: #666; font-size: 0.95rem; margin-bottom: 15px; font-weight: 500; }
    
    /* Bloque del Número Celular */
    .phone-box {
      margin-bottom: 20px;
    }
    .phone-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #0066cc;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 8px 16px;
      background-color: #eef5fc;
      border-radius: 20px;
      transition: background 0.2s ease;
    }
    .phone-link:hover { background-color: #e0edf9; }

    /* Botón de guardar contacto (.vcf) */
    .btn-download {
      display: block;
      background-color: #0066cc;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      transition: background 0.2s ease;
    }
    .btn-download:hover { background-color: #0052a3; }
    
    /* Estilos del Código QR */
    .qr-box {
      margin: 20px 0;
      text-align: center;
    }
    .qr-title {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .qr-img {
      width: 140px;
      height: 140px;
      border-radius: 8px;
      border: 1px solid #eaeaea;
      padding: 5px;
      background: #fff;
    }

    /* Enlaces a Redes Sociales */
    .social-links { display: flex; flex-direction: column; gap: 10px; }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      color: #333;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid #eaeaea;
      transition: background 0.2s ease;
    }
    .social-link:hover { background-color: #f0f0f0; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Carga logo.png -->
    <div class="header">
      <img src="logo.png" alt="Logo Empresa" class="company-logo">
    </div>

    <!-- Carga Foto.jpeg -->
    <div class="profile-section">
      <img src="Foto.jpeg" alt="Foto de Perfil" class="profile-img">
      
      <!-- DATOS DEL USUARIO -->
      <h1>Alex Huaman</h1>
      <p class="title">Jefe de Tecnología de la Información y Comunicaciones</p>

      <!-- NÚMERO CELULAR (Llama directamente al presionar) -->
      <div class="phone-box">
        <a href="tel:+51992197030" class="phone-link">
          📞 +51 992 197 030
        </a>
      </div>

      <!-- Descarga contacto.vcf -->
      <a href="contacto.vcf" download class="btn-download">💾 Guardar en Contactos</a>

      <!-- BLOQUE DEL CÓDIGO QR -->
      <div class="qr-box">
        <p class="qr-title">Escanea para compartir mi tarjeta:</p>
        <img src="qr" alt="Código QR de contacto" class="qr-img">
      </div>

      <!-- ENLACES SOCIALES -->
      <div class="social-links">
        <a href="https://wa.me/51992197030" target="_blank" class="social-link">WhatsApp</a>
        <a href="https://quillaresources.com" target="_blank" class="social-link">Sitio Web</a>
      </div>
    </div>
  </div>

</body>
</html>
